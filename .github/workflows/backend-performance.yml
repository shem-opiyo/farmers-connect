name: Backend Performance Tests

on:
  push:
  pull_request:

jobs:
  backend-performance:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///db.sqlite3
      DEBUG: "False"
      SECRET_KEY: ci-secret-key
      HOST: 127.0.0.1
      PORT: 8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev curl

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare database
        working-directory: backend
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py seed_perf_data

      - name: Start backend server
        working-directory: backend
        run: |
          python manage.py runserver "$HOST:$PORT" &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in {1..30}; do
            if curl -fsS "http://$HOST:$PORT/api/counties/" >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time" >&2
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JMeter
        run: |
          JMETER_VERSION=5.6.3
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" -o /tmp/jmeter.tgz
          tar -xzf /tmp/jmeter.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run JMeter (headless) and generate HTML report
        run: |
          rm -rf results/html-report
          mkdir -p results
          jmeter -n \
            -t "tests/performance tests/farmers_connect_test_plan.jmx" \
            -l results/results.jtl \
            -e -o results/html-report \
            -JHOST="$HOST" \
            -JPORT="$PORT" \
            -JPROTOCOL=http \
            -JUSERS="${USERS:-5}" \
            -JRAMP="${RAMP:-5}" \
            -JDURATION="${DURATION:-30}"

      - name: Upload JMeter HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report-${{ github.run_id }}
          path: results/html-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JMeter raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results-${{ github.run_id }}
          path: results/results.jtl
          if-no-files-found: warn
          retention-days: 14

      - name: Stop backend server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" || true
          fi