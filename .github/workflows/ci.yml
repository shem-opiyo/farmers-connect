name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # pick a version compatible with your deps/Django 5.2
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (if needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checks and tests
        env:
          # settings.py defaults to sqlite when DATABASE_URL is unset; keep CI off MySQL
          DATABASE_URL: sqlite:///db.sqlite3
          DEBUG: "False"
          SECRET_KEY: ci-secret-key
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build